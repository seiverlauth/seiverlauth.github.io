<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Lists</title>
        <meta name="description" content="Lists" />
        <link rel="icon" href="https://github.com/seiverlauth/seiverlauth.github.io/blob/master/fav.png?raw=true" type="image/png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="stylesheet" href="https://use.typekit.net/pjo4see.css" />
        <style>
          body {
            margin: 0;
            padding: 2em;
            font-family: ibm-plex-mono, sans-serif;
            font-weight: 400;
            font-style: normal;
            font-size: 15px;
            line-height: 1.2;
            background-color: #f3f4f1;
          }
          h1,h2,h3,p { padding: 0; margin: 0; font-size: 1em; font-weight: normal; }
          h1 { margin: 0 0 1em 0; }
          a { color: #000; text-decoration: none; }
          a:hover { text-decoration: underline; }
          header, main, footer { width: 30em; max-width: 100%; }
          header:after, main:after { content: ""; display: block; margin: 1em 0; }
          footer:before { content: "--"; }
          footer { margin: 1em 0 2em 0; }

          .list-item { margin-bottom: 1em; }

          .list-toggle {
            cursor: pointer;
            user-select: none;
          }

          .list-toggle:hover { text-decoration: underline; }

          .list-content {
            display: none;
            margin-top: 0.5em;
            margin-left: 1.2em;
            line-height: 1.6;
          }

          .list-content.open { display: block; }

          .list-content p { margin: 0.2em 0; }

          .list-content p:before { content: "⮑ "; }

          .subheading {
            margin-top: 0.9em;
            margin-bottom: 0.3em;
          }

          .list-content p.catline {
            margin-left: 1.5em;
          }

          .list-content p.catline:before { content: none; }

          .list-content span.category { text-decoration: underline; }
        </style>
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Home</a> &gt; <span>Lists</span>
            </nav>
        </header>
        <main id="listsContainer"></main>
        <footer>
            <p>Thanks for stopping by.</p>
            <p>&copy; 2026 SML</p>
        </footer>

        <script>
            const lists = [
                {
                    title: "Mount Rushmore: Movies",
                    items: ["Arrival", "Interstellar", "Dazed and Confused", "Good Will Hunting"]
                },
                {
                    title: "Mount Rushmore: Pixar",
                    items: ["WALL-E", "Incredibles", "Monsters Inc", "Cars"]
                },
                {
                    title: "Mount Rushmore: Sandwiches",
                    items: ["Turkey club", "Banh mi", "Pulled pork with coleslaw", "Fried chicken"]
                },
                {
                    title: "Mount Rushmore: Old Money Last Names",
                    items: ["Lightfoot", "Moneypenny", "Poindexter", "Drinkwine"]
                },
                {
                    title: "Favorite Foods",
                    items: [
                        "Blueberries (fresh picked)",
                        "Pineapple",
                        "Roasted broccoli",
                        "Banana with peanut butter",
                        "Rice",
                        "Pad thai (must be spicy)",
                        "Tuna avocado sushi roll",
                        "Fried chicken sandwich (must be spicy)",
                        "Mexican breakfast",
                        "Guacamole"
                    ]
                },
                {
                    title: "Things To Do When You Visit SD",
                    sections: [
                        {
                            heading: "Encinitas",
                            items: [
                                "Coffee: Necessity Coffee, Bump, Lofty, Rose Hill Purveyors",
                                "Breakfast: Le Papagayo, Goodonya, Nectarine Grove",
                                "Food: Fish 101, Temaki Bar, Seaside Market, Hamburger Hut, Birdseye Kitchen, Corner Pizza",
                                "Drinks: Duck Foot, Fox Point Farms, Saloon, 1st Street, Roxy, Shanty, Kraken, Leucadian, Sago, Shelter",
                                "See: Meditation Gardens",
                                "Walk: Coastal Rail Trail"
                            ]
                        },
                        {
                            heading: "North Park, South Park, Mission Valley",
                            items: [
                                "Food: Sunnyboy Biscuit Co, Grand Ole BBQ, Louisiana Purchase, Buona Forchetta, Bosforo, Tribute Pizza, Finca, Cassette Pizza, Fortunate Son, Dunedin",
                                "Drinks: Polite Provisions, Pure Project, Fall Brewing, Oddish Wine",
                                "See: Balboa Park, The Lafayette Hotel"
                            ]
                        },
                        {
                            heading: "Bay Hill",
                            items: [
                                "Food: High Dive, Bay Hill Tavern, Pit Stop Pizza, Siesels Meats and Deli, Bay Park Coffee",
                                "Drinks: Sidecar, Coronado Brewing"
                            ]
                        },
                        {
                            heading: "Little Italy & Downtown",
                            items: [
                                "Food: Allegro, Morning Glory, Monello, Barbusa, Crack Shack, Nolita Hall, Cocina 35",
                                "Drinks: Vino Carta, Ballast Point"
                            ]
                        },
                        {
                            heading: "Pacific Beach & Mission Beach",
                            items: [
                                "Food: Nico's Fish Market, Costa Brava, Leilani's Cafe, Harry's Taco Club, Enoteca Adriano",
                                "Drinks: PB Pub, Maverick's Beach Club, Duck Dive, West End, Tavern, Silver Fox",
                                "Walk: The strand or the bay (good people watching)"
                            ]
                        },
                        {
                            heading: "Ocean Beach, Point Loma, Sunset Cliffs",
                            items: [
                                "Food: Ikes Love and Sandwiches, OB Noodle House, It's Raw Poke",
                                "Drinks: OB Brewery, Harbor Town Pub, Eppig Brewing, Wonderland Ocean Pub, Sunshine Company",
                                "See: Cabrillo National Monument, Sunset Cliffs"
                            ]
                        },
                        {
                            heading: "La Jolla",
                            items: [
                                "See: La Jolla Cove (seals), Mount Soledad (views)",
                                "Walk: La Jolla Shores, Torrey Pines Nature Reserve"
                            ]
                        },
                        {
                            heading: "Del Mar and Solana",
                            items: [
                                "Food: Stratford Court Cafe, Bangkok Bay Thai",
                                "Drinks: Monarch Ocean Pub, Viewpoint Brewery",
                                "Walk: Tide Park Beach"
                            ]
                        },
                        {
                            heading: "Coronado",
                            items: [
                                "See: Hotel Del",
                                "Walk: Coronado Ave / Ocean Blvd"
                            ]
                        }
                    ]
                },
                {
                    title: "Things I'm Curious About",
                    items: [
                        "Why a pork chop is called a chop",
                        "Sanctions enforcement and shadow fleet tracking",
                        "Moby Dick was a real whale",
                        "The best Prisoner's Dilemma strategy (be nice, forgiving, retaliatory, and clear)",
                        "The endocrine system",
                        "Why humans can live in groups of 150+ and other animals typically can't",
                        "Where the name \"Hoosier\" came from (nobody knows)",
                        "Cosmic Microwave Background",
                        "How the US population nearly quadrupled in the 20th century",
                        "The Ising Model and critical points",
                        "Turkish Airlines",
                        "How backpropagation works",
                        "The Medici Family",
                        "The Network State",
                        "How Europe conquered most of the world",
                        "Bayesian prediction",
                        "Photosynthesis as a quantum effect",
                        "Neutrinos",
                        "Sleep talking and somniloquy",
                        "Predictive processing",
                        "BJ Fogg's work on behavior design",
                        "Wealth inequality and historical cycles",
                        "Cybersecurity and AI",
                        "KFC was franchised when Sanders was 65",
                        "Mimetic desire",
                        "Elite overproduction theory",
                        "The physical economy buildout",
                        "Why tigers aren't green",
                        "How the marathon is named for the distance between Marathon and Athens",
                        "Sports as a form of specialization",
                        "Hercules-Corona Borealis Great Wall",
                        "Looking at stocks through the lens of products I actually enjoy using",
                        "The ad market and why certain ads get chosen"
                    ]
                },
            ];

            function buildLists() {
                const container = document.getElementById('listsContainer');

                lists.forEach(list => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'list-item';

                    const toggle = document.createElement('p');
                    toggle.className = 'list-toggle';
                    toggle.textContent = list.title;

                    const content = document.createElement('div');
                    content.className = 'list-content';

                    if (list.sections) {
                        list.sections.forEach(section => {
                            const heading = document.createElement('p');
                            heading.className = 'subheading';
                            heading.textContent = section.heading;
                            content.appendChild(heading);

                            section.items.forEach(item => {
                                const splitIndex = item.indexOf(': ');
                                const p = document.createElement('p');
                                p.className = 'catline';

                                if (splitIndex !== -1) {
                                    const label = item.slice(0, splitIndex);
                                    const places = item.slice(splitIndex + 2);

                                    const span = document.createElement('span');
                                    span.className = 'category';
                                    span.textContent = label;

                                    p.appendChild(span);
                                    p.appendChild(document.createTextNode(': ' + places));
                                } else {
                                    p.textContent = item;
                                }

                                content.appendChild(p);
                            });
                        });
                    } else {
                        list.items.forEach(item => {
                            const p = document.createElement('p');
                            p.textContent = item;
                            content.appendChild(p);
                        });
                    }

                    toggle.addEventListener('click', () => {
                        const isOpen = content.classList.contains('open');
                        document.querySelectorAll('.list-content').forEach(el => el.classList.remove('open'));
                        if (!isOpen) content.classList.add('open');
                    });

                    wrapper.appendChild(toggle);
                    wrapper.appendChild(content);
                    container.appendChild(wrapper);
                });
            }

            buildLists();
        </script>
    </body>
</html>
