      <script>
        // Shuffle the images on each visit (they are already in the HTML for readers without JS).
        const stream = document.getElementById('moodStream');
        const items = Array.from(stream.children);
        for (let i = items.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [items[i], items[j]] = [items[j], items[i]];
        }
        items.forEach(el => stream.appendChild(el));
