          .swell .word { white-space: nowrap; }

          html { scroll-behavior: smooth; }
          a[href], summary { position: relative; }
          a[href]::after, summary::after { content: ""; position: absolute; inset: -3px -6px; }
          .slinky {
            position: fixed;
            left: 12px;
            bottom: 40px;
            writing-mode: vertical-rl;
            rotate: 180deg;
            font-size: 13px;
            white-space: nowrap;
            transform-origin: 50% 50%;
          }
          a.slinky.to-top { position: fixed; }
          header#top { display: flex; align-items: center; justify-content: space-between; gap: 2em; width: auto; max-width: 1400px; margin-bottom: 1.5em; }
          header#top::after { display: none; }
          .sizer { display: flex; align-items: center; gap: 4px; }
          .sizer button { all: unset; cursor: pointer; padding: 5px; display: grid; place-items: center; }
          .sizer button::before { content: ""; display: block; border-radius: 50%; border: 1px solid #000; background: transparent; }
          .sizer button[data-size="160"]::before { width: 5px; height: 5px; }
          .sizer button[data-size="240"]::before { width: 8px; height: 8px; }
          .sizer button[data-size="420"]::before { width: 11px; height: 11px; }
          .sizer button[aria-pressed="true"]::before { background: #000; }
          .sizer button:focus-visible { outline: 1px solid #000; outline-offset: 1px; border-radius: 50%; }
          @media (max-width: 480px) { .sizer { display: none; } }
          .mood-stream img { cursor: zoom-in; transition: opacity 200ms ease; }
          .mood-stream img:hover { opacity: 0.85; }
          .iso { position: fixed; inset: 0; z-index: 10; background: rgb(243 244 241 / 0.97); display: grid; place-items: center; padding: 3em 2em; cursor: zoom-out; }
          .iso[hidden] { display: none; }
          .iso figure { margin: 0; max-width: min(1200px, 100%); display: flex; flex-direction: column; align-items: flex-start; gap: 0.9em; }
          .iso img { display: block; max-width: 100%; max-height: calc(100vh - 6em); width: auto; height: auto; border-radius: 6px; }
