name: Update music page

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: music
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch from Spotify and rebuild music.html
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 .github/scripts/music.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet -- music.html; then
            echo "no changes"
            exit 0
          fi
          git config user.name "music bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.html
          git commit -m "Update music"
          git push
          # ask GitHub Pages to rebuild, since pushes from this job don't always trigger it
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" > /dev/null || true
